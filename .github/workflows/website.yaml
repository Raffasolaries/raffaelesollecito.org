---
name: website
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/**"
  pull_request:
    branches: [main]
    paths:
      - "website/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  S3_BUCKET: www.raffaelesollecito.org
  CLOUDFRONT_DISTRIBUTION_ID: E1QA011ASCYU5O

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: website

      - name: Build
        run: npm run build
        working-directory: website
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
          # yamllint disable-line rule:line-length
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: website-out
          path: website/out
          retention-days: 1

  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ format(
            'arn:aws:iam::{0}:role/github-actions-oidc',
            secrets.AWS_ACCOUNT_ID) }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: website-out
          path: out

      - name: Sync to S3
        run: |
          aws s3 sync out/ "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "documents/*" \
            --exclude "wp-content/*" \
            --exclude "wp-includes/*" \
            --exclude "feed/*" \
            --exclude "*.html" \
            --exclude "sitemap.xml" \
            --exclude "robots.txt" \
            --exclude "llms.txt" \
            --exclude "site.webmanifest" \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata-directive REPLACE

          # HTML files: no cache (always revalidate)
          aws s3 sync out/ "s3://${S3_BUCKET}/" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --metadata-directive REPLACE

          # SEO files: short cache (revalidate daily)
          aws s3 sync out/ "s3://${S3_BUCKET}/" \
            --exclude "*" \
            --include "sitemap.xml" \
            --include "robots.txt" \
            --include "llms.txt" \
            --include "site.webmanifest" \
            --cache-control "public, max-age=86400, must-revalidate" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Notify IndexNow (Bing / Copilot)
        run: |
          python3 - <<'PY'
          import json,urllib.request,xml.etree.ElementTree as ET
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          xml=urllib.request.urlopen('https://raffaelesollecito.org/sitemap.xml').read()
          urls=[l.text for l in ET.fromstring(xml).findall('.//s:loc',ns)]
          body=json.dumps({'host':'raffaelesollecito.org','key':'5b508b0a515e349a5e6824763c45b143','keyLocation':'https://raffaelesollecito.org/5b508b0a515e349a5e6824763c45b143.txt','urlList':urls}).encode()
          req=urllib.request.Request('https://api.indexnow.org/indexnow',data=body,headers={'Content-Type':'application/json; charset=utf-8'})
          try: print('IndexNow', urllib.request.urlopen(req).status, len(urls), 'urls')
          except Exception as e: print('IndexNow failed (non-blocking):', e)
          PY
